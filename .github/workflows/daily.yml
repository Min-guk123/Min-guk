name: 코스닥 상대강도 일일 갱신

on:
  schedule:
    # 평일 16:20 KST (= 07:20 UTC). 장 마감(15:30) 뒤 종가가 확정된 다음 실행.
    # GitHub 예약 실행은 몰리는 시간에 10~30분 늦게 시작될 수 있음.
    - cron: "20 7 * * 1-5"
  workflow_dispatch: {}   # Actions 탭에서 'Run workflow'로 수동 실행

permissions:
  contents: write

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 데이터 수집 + 계산
        env:
          TZ: Asia/Seoul
        run: python scripts/build.py --source naver

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/downloads data/snapshots
          if git diff --cached --quiet; then
            echo "변경 없음(휴장일 등) - 커밋 생략"
          else
            git commit -m "데이터 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            git push
          fi
